version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hbx-postgres
    environment:
      POSTGRES_DB: hbx_control
      POSTGRES_USER: hbx
      POSTGRES_PASSWORD: hbx_dev_pwd
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbx -d hbx_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hbx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hbx-minio
    environment:
      MINIO_ROOT_USER: hbx_minio
      MINIO_ROOT_PASSWORD: hbx_minio_pwd
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  minio_data: